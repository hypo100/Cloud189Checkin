name: 天翼云盘签到
on:
  watch:
    types: started
  workflow_dispatch:
  schedule:
    - cron: 35 4 * * *    # UTC时间，对应北京时间12:35
    - cron: 35 7 * * *    # UTC时间，对应北京时间15:35
env:
  # 直接把机密注入环境变量，脚本直接读取，不需要生成.env！！
  TY_ACCOUNTS: ${{ secrets.TY_ACCOUNTS }}
permissions:
  contents: write
jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: 🔀 Check out code
        uses: actions/checkout@v4

      - name: 获取北京时间日期
        id: date
        run: echo "date=$(TZ=Asia/Shanghai date +%Y-%m-%d)" >> $GITHUB_OUTPUT

      - name: 🔄 恢复签到标记缓存
        uses: actions/cache@v5
        with:
          path: .last_checkin_date
          key: ${{ runner.os }}-lastcheckin-${{ github.ref }}

      - name: 判断今日是否已经签到
        id: check_already
        run: |
          if [ -f .last_checkin_date ]; then
            LAST=$(cat .last_checkin_date)
            TODAY=${{ steps.date.outputs.date }}
            if [ "$LAST" = "$TODAY" ]; then
              echo "skip=true" >> $GITHUB_OUTPUT
              echo "今日已经签到，跳过登录签到步骤"
            else
              echo "skip=false" >> $GITHUB_OUTPUT
            fi
          else
            echo "skip=false" >> $GITHUB_OUTPUT
          fi

      - name: 随机延时 0~2分钟（0 ~ 119秒）
        if: steps.check_already.outputs.skip == 'false'
        run: |
          DELAY=$((RANDOM % 120))
          echo "等待${DELAY}秒"
          sleep $DELAY

      - name: 🔧 Setup Node.js
        if: steps.check_already.outputs.skip == 'false'
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: npm

      - name: 📦 Install dependencies
        if: steps.check_already.outputs.skip == 'false'
        run: npm install

      - name: 🚀 Run签到脚本
        if: steps.check_already.outputs.skip == 'false'
        uses: nick-fields/retry@v3
        with:
          timeout_minutes: 3
          max_attempts: 3
          command: npm start

      - name: ✅ 记录今日签到成功标记
        if: steps.check_already.outputs.skip == 'false' && success()
        run: echo ${{ steps.date.outputs.date }} > .last_checkin_date

      - name: 💾 Save cached Cookie
        if: steps.check_already.outputs.skip == 'false'
        uses: actions/cache@v5
        with:
          path: .token
          key: ${{ runner.os }}-token-${{ github.ref }}
